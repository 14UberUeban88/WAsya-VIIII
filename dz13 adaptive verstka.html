<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя адаптивная страничка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .my-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .my-button {
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 767px) {
            .my-text {
                font-size: 14px;
            }

            .my-image {
                width: 100%;
            }

            .my-button {
                width: 100%;
            }
        }

        @media (min-width: 768px) and (max-width: 1024px) {
            .my-text {
                font-size: 20px;
            }

            .my-image {
                max-width: 80%;
            }

            .my-button {
                width: 200px;
                height: auto;
            }
        }

        @media (min-width: 1025px) {
            .container {
                align-items: center;
                text-align: center;
            }

            .my-image {
                max-width: 600px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Всем привет</h1>
        
        <p class="my-text">
            Этот текст меняет свой размер. На мобиле он мелкий, на планшете крупный, а на компе — по центру.
        </p>
        
        <img src="" alt="Картинка" class="my-image">
        
        <button class="my-button">Кликни меня</button>
    </div>

</body>
</html>
