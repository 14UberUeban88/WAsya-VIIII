<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивный профиль</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 450px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* Главный круг аватара в профиле */
        .avatar-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #e1e8ed;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border: 4px solid #4a90e2;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-container svg {
            width: 70px;
            height: 70px;
            fill: #7f8c8d;
            display: block;
        }

        h1 {
            margin: 10px 0 5px 0;
            color: #2c3e50;
            text-align: center;
            width: 100%;
            font-size: 28px;
        }

        .bio {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
            text-align: center;
            width: 100%;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            width: 100%;
        }

        .badge {
            background: #4a90e2;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
            width: 100%;
        }

        h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            text-align: center;
            width: 100%;
        }

        .form-group {
            text-align: left;
            width: 100%;
        }

        label {
            font-size: 12px;
            font-weight: bold;
            color: #7f8c8d;
            display: block;
            margin-top: 12px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 5px;
            font-family: inherit;
            font-size: 14px;
        }

        input[type="file"] {
            padding: 5px 0;
            border: none;
            cursor: pointer;
        }

        /* Окошко предпросмотра того, как картинка обожмется в круг */
        .preview-box {
            display: none;
            width: 140px;
            height: 140px;
            margin: 10px auto;
            border-radius: 50%;
            border: 3px dashed #ff9800; /* Оранжевый пунктир показывает границы круга */
            overflow: hidden;
            box-sizing: border-box;
        }

        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Блок профиля -->
        <div class="avatar-container">
            <img id="profileImage" src="" alt="Аватар">
            <svg id="profileSvg" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
            </svg>
        </div>

        <h1 id="profileName">Иван Иванов</h1>
        <p class="bio" id="profileBio">Студент курса Python. Люблю кодить, пить кофе и автоматизировать рутину.</p>

        <div class="skills" id="profileSkills">
            <span class="badge">Python</span>
            <span class="badge">Git</span>
            <span class="badge">HTML/CSS</span>
        </div>

        <hr>

        <!-- Форма редактирования -->
        <h3>Редактировать профиль</h3>
        <div class="form-group">
            <label>Имя:</label>
            <input type="text" id="inputName" value="Иван Иванов">

            <label>О себе:</label>
            <textarea id="inputBio" rows="3">Студент курса Python. Люблю кодить, пить кофе и автоматизировать рутину.</textarea>

            <label>Навыки (через запятую):</label>
            <input type="text" id="inputSkills" value="Python, Git, HTML/CSS">

            <!-- Выбор файла -->
            <label>Загрузить аватарку с компьютера:</label>
            <input type="file" id="inputAvatarFile" accept="image/*" onchange="showPreview(this)">

            <!-- Временная миниатюра-круг, чтобы ВИДЕТЬ результат до сохранения -->
            <div class="preview-box" id="previewBox">
                <img id="previewImage" src="" alt="Превью">
            </div>

            <button onclick="updateProfile()">Обновить страницу</button>
        </div>
    </div>

    <!-- Интерактивная логика на чистом JS -->
    <script>
        // Глобальная переменная для хранения загруженной картинки
        let selectedImageSrc = "";

        // Показываем миниатюру сразу после выбора в проводнике
        function showPreview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();

                reader.onload = function (e) {
                    selectedImageSrc = e.target.result;

                    // Показываем оранжевое круглое окошко предпросмотра
                    const previewBox = document.getElementById('previewBox');
                    const previewImg = document.getElementById('previewImage');

                    previewImg.src = selectedImageSrc;
                    previewBox.style.display = 'block';
                }

                reader.readAsDataURL(input.files[0]);
            }
        }

        // Обновляем данные по кнопке
        function updateProfile() {
            const newName = document.getElementById('inputName').value;
            const newBio = document.getElementById('inputBio').value;
            const skillsRaw = document.getElementById('inputSkills').value;

            document.getElementById('profileName').innerText = newName.trim() || "Без имени";
            document.getElementById('profileBio').innerText = newBio.trim() || "";

            // Переносим картинку из превью в основной профиль
            if (selectedImageSrc !== "") {
                const imgElement = document.getElementById('profileImage');
                const svgElement = document.getElementById('profileSvg');

                imgElement.src = selectedImageSrc;
                imgElement.style.display = 'block';
                svgElement.style.display = 'none';

                // Прячем временное окошко предпросмотра
                document.getElementById('previewBox').style.display = 'none';
            }

            // Обновление тегов
            const skillsContainer = document.getElementById('profileSkills');
            skillsContainer.innerHTML = '';

            const skillsArray = skillsRaw.split(',');
            skillsArray.forEach(skill => {
                const trimmedSkill = skill.trim();
                if (trimmedSkill) {
                    const span = document.createElement('span');
                    span.className = 'badge';
                    span.innerText = trimmedSkill;
                    skillsContainer.appendChild(span);
                }
            });
        }
    </script>

</body>
</html>
