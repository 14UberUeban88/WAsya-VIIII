<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивный лендинг (SCSS)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="landing">
        <div class="card">
            <h1>Адаптивный фон лендинга</h1>
            <p>Измените ширину окна браузера, чтобы увидеть, как меняется цвет фона:</p>
            <ul>
                <li><strong>Более 768px:</strong> Синий фон</li>
                <li><strong>От 480px до 768px:</strong> Зелёный фон</li>
                <li><strong>Менее 480px:</strong> Жёлтый фон</li>
            </ul>
        </div>
    </main>
</body>
</html>
